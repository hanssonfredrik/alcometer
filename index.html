<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0b0912" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Neon" />
    <meta
      name="description"
      content="Track drinks, estimate your blood-alcohol level, and build sober-day streaks."
    />
    <title>Neon Tracker</title>
    <script>
      // Paint the saved accent before React hydrates so a non-default theme
      // doesn't flash blue on load. Reads the same store as lib/storage.js
      // (web only — the native shells keep data in Preferences and are
      // covered by the splash screen). Pre-v3 stores say 'pink' for "default";
      // the migration ladder turns that into blue, so skip it here too.
      try {
        var d = JSON.parse(localStorage.getItem('neontrk_v1'))
        var t = d && d.profile && d.profile.theme
        if (t === 'pink' && (d.version || 1) < 3) t = null
        if (t) document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
