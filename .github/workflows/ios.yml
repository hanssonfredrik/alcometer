# Builds the iOS app on a macOS runner and uploads it to TestFlight.
# There is no local Mac in this project's dev setup: this workflow IS the
# iOS build machine.
#
# Signing is manual, with one saved Apple Distribution certificate and an App
# Store profile (the same setup as DiabetesNinja). Automatic signing on a fresh
# runner created a new Apple Development certificate on every run until the
# team hit Apple's limit. Setup steps: docs/IOS-SIGNING.md.
#
# Required repository secrets:
#   APPLE_CERT_P12_BASE64             base64 of the Venueve AB Apple Distribution .p12
#   APPLE_CERT_PASSWORD               its password
#   APPLE_PROVISIONING_PROFILE_BASE64 base64 of the App Store profile for se.venueve.neontracker
#   APPLE_CODESIGN_PROVISION          that profile's exact name ("Promilla AppStore")
#   APPLE_TEAM_ID                     e.g. "AB12CD34EF"
#   APP_STORE_CONNECT_KEY_ID          App Store Connect API key, used for the upload
#   APP_STORE_CONNECT_ISSUER_ID
#   APP_STORE_CONNECT_PRIVATE_KEY     contents of the AuthKey_<KEY_ID>.p8 file
#
# One-time prerequisites (web UI, no Mac needed):
#   1. Register the bundle id "se.venueve.neontracker" at
#      developer.apple.com → Identifiers.
#   2. Create the app in App Store Connect with that bundle id.

name: iOS (TestFlight)

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Build web app and sync Capacitor
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Write App Store Connect API key
        env:
          PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/private_keys/AuthKey_${KEY_ID}.p8

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@77ba2a2a8f5cfc8c405ebf3159f767c323e238f9 # v7.1.0
        with:
          p12-file-base64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERT_PASSWORD }}

      # Read the identity's name from the keychain rather than a secret, so a
      # stray newline or team-name typo can't cause "signing key not found".
      - name: Resolve codesign identity
        id: identity
        run: |
          security find-identity -v -p codesigning
          NAME=$(security find-identity -v -p codesigning \
                 | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)
          if [ -z "$NAME" ]; then
            echo "::error::No code signing identity found in the keychain."
            exit 1
          fi
          echo "Using signing identity: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          PROFILES_A="$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILES_B="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_A" "$PROFILES_B"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > profile.mobileprovision
          UUID=$(security cms -D -i profile.mobileprovision | plutil -extract UUID raw -)
          cp profile.mobileprovision "$PROFILES_A/$UUID.mobileprovision"
          cp profile.mobileprovision "$PROFILES_B/$UUID.mobileprovision"

      # No -allowProvisioningUpdates: with manual signing Xcode never asks
      # Apple for a certificate or profile.
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IDENTITY: ${{ steps.identity.outputs.name }}
          PROFILE: ${{ secrets.APPLE_CODESIGN_PROVISION }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload to TestFlight
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.APPLE_CODESIGN_PROVISION }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>se.venueve.neontracker</key>
              <string>${PROFILE}</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -authenticationKeyPath ~/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"

      - name: Upload archive as artifact (debugging aid)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcarchive-logs
          path: |
            build/App.xcarchive/Info.plist
            ~/Library/Logs/gym
          if-no-files-found: ignore
